<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="game-id" content="pug-after-midnight"><meta name="theme-color" content="#172c2a"><title>Мопс: После полуночи</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23172c2a'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="css/style.css"><script type="module" src="js/main.js"></script></head><body>
<main id="app" aria-label="Мопс: После полуночи — игра">
<canvas id="game" width="1100" height="600" tabindex="0" aria-label="Мир игры. WASD или стрелки — движение; Space — прыжок; E — нюх; F — осмотреть; M — карта; J — дело; P — пауза."></canvas>
<header id="hud" hidden><div class="location"><span id="chapter-number"></span><strong id="chapter-title"></strong><div class="status-line"><span id="phase-label"></span><span id="resources"></span></div></div><nav aria-label="Игровое меню"><button id="map" title="Карта · M" aria-label="Карта"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z"/><path d="M9 3v16M15 5v16"/><path d="m5 11 2-1m5 1 1 1m4 1 2-2"/></svg><span class="hud-caption">Карта<kbd>M</kbd></span></button><button id="journal" title="Дело · J" aria-label="Улики и показания"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h14v18H6zM3 6h5M3 11h5M3 16h5M11 8h5M11 12h5M11 16h3"/></svg><span class="hud-caption">Улики<kbd>J</kbd></span></button><button id="inventory" title="Карман"><span>♧</span><b id="score">0 / 9</b></button><button id="pause" aria-label="Пауза" title="Пауза · P"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="5" height="18" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="3" width="5" height="18" rx="1" fill="currentColor" stroke="none"/></svg><span class="hud-caption">Пауза<kbd>Esc</kbd></span></button></nav></header>
<div id="objective" hidden><span>✦</span><p id="mission"></p></div><div id="thought" hidden aria-live="polite"></div>
<div id="play-controls" hidden><div class="dpad" aria-label="Движение"><button data-action="up" aria-label="Идти вверх">↑</button><button data-action="left" aria-label="Идти влево">←</button><button data-action="down" aria-label="Идти вниз">↓</button><button data-action="right" aria-label="Идти вправо">→</button></div><div class="keyboard-hint"><kbd>W A S D</kbd> идти <span>·</span><kbd>Space</kbd> прыжок</div><div class="abilities"><button data-action="jump">Прыжок <kbd>Space</kbd></button><button id="sniff" aria-pressed="false">Нюх <kbd>E</kbd></button><button data-action="interact">Осмотреть <kbd>F</kbd></button><button id="night">Полночь <kbd>N</kbd></button></div></div>
<section id="screen" class="screen title-screen" aria-labelledby="screen-title"><div class="dialogue-portrait" aria-hidden="true"></div><div class="screen-inner"><p id="screen-label"></p><h1 id="screen-title">Мопс: После полуночи</h1><p id="screen-text"></p><div id="screen-extra"></div><div id="screen-actions"></div><p id="screen-footnote"></p></div></section>
<div class="corner"><button id="help" aria-label="Управление" title="Управление">?</button><button id="audio-settings" aria-label="Настройки звука" title="Звук">♫</button><button id="fullscreen" aria-label="Полноэкранный режим" title="Полный экран">⛶</button></div>
<div id="audio-panel" hidden><p id="music-now" role="status" style="font-size:12px;line-height:1.5">Музыка включится после первого нажатия.</p><label for="music-volume">Музыка</label><input id="music-volume" type="range" min="0" max="100" value="55"><label for="volume">Звуки и гав</label><input id="volume" type="range" min="0" max="100" value="65"><button id="mute" aria-pressed="false">Выключить весь звук</button><button id="test-sound" style="margin-top:8px">Послушать гав</button><p id="sound-status" role="status" style="font-size:12px;line-height:1.5">Днём и ночью звучат разные темы. При репликах музыка становится тише.</p></div>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p></main></body></html>
